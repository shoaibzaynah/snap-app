name: Companion App OTA Auto-Update

on:
  push:
    branches:
      - main
    paths:
      - 'companion-app/**'

jobs:
  update:
    name: Build & Push OTA Bundle
    runs-on: ubuntu-latest
    if: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: companion-app/package.json

      - name: 📦 Setup Expo EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Install dependencies
        working-directory: companion-app
        run: npm ci

      - name: 🚀 Publish silent OTA Update
        working-directory: companion-app
        run: eas update --auto --message "Auto update from GitHub commit ${{ github.sha }}"
