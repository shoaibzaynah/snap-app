name: Build Companion Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'companion-android/**'
      - '.github/workflows/build-companion-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: 📦 Download Gradle 8.2.2 & Compile APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2.2-bin.zip
          unzip -q gradle-8.2.2-bin.zip
          export PATH=$PWD/gradle-8.2.2/bin:$PATH
          cd companion-android
          gradle assembleDebug --no-daemon --stacktrace

      - name: 🔍 Verify Compiled APK Binary
        run: |
          APK_PATH="companion-android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file was not generated!"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$APK_PATH")
          echo "Generated APK size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 500000 ]; then
            echo "Error: APK size is unexpectedly small ($FILE_SIZE bytes)!"
            exit 1
          fi
          file "$APK_PATH"

      - name: 🚚 Deploy APK to Public Downloads
        run: |
          mkdir -p public/downloads
          cp companion-android/app/build/outputs/apk/debug/app-debug.apk public/downloads/snap-safety-companion.apk
          ls -lh public/downloads/snap-safety-companion.apk

      - name: 🚀 Commit & Push Live APK Binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/snap-safety-companion.apk
          if git diff --staged --quiet; then
            echo "No changes in APK binary."
          else
            git commit -m "chore: deploy compiled companion APK binary v1.0.0 [skip ci]"
            git push origin main
          fi
