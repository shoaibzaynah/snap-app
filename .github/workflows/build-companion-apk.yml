name: Build Companion Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'companion-android/**'
      - '.github/workflows/build-companion-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Accept Android Licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: 📦 Download Gradle 8.2.1 & Compile Release APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o gradle-bin.zip
          unzip -q gradle-bin.zip
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PWD/gradle-8.2.1/bin:$PATH
          cd companion-android
          if [ ! -f snap-release.keystore ]; then
            keytool -genkeypair -v -keystore snap-release.keystore -alias snapapp -keyalg RSA -keysize 2048 -validity 10000 -storepass snapapp123 -keypass snapapp123 -dname "CN=SnapApp, OU=Security, O=SnapApp, L=Global, S=Global, C=US"
          fi
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log || {
            echo "### ❌ Build Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 ../build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: 🔍 Verify Compiled APK Binary
        run: |
          APK_PATH="companion-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file was not generated!"
            if [ -f build.log ]; then
              tail -n 50 build.log
            fi
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$APK_PATH")
          echo "Generated APK size: $FILE_SIZE bytes"
          file "$APK_PATH"

      - name: 🚚 Deploy APK to Public Downloads
        run: |
          mkdir -p public/downloads
          cp companion-android/app/build/outputs/apk/release/app-release.apk public/downloads/snap-safety-companion.apk
          ls -lh public/downloads/snap-safety-companion.apk

      - name: 🚀 Commit & Push Live APK Binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/snap-safety-companion.apk companion-android/snap-release.keystore
          if git diff --staged --quiet; then
            echo "No changes in APK binary."
          else
            git commit -m "chore: deploy compiled companion APK binary v2.1.0 [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: 📄 Commit Build Failure Diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f build.log ]; then
            grep -A 35 "What went wrong:" build.log > build_failure.txt || tail -n 250 build.log > build_failure.txt
            git add build_failure.txt
            git commit -m "chore: build failure diagnostics [skip ci]" || true
            git push origin main || true
          fi
