<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Offline | SNAP APP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 24px 20px; user-select: none; }
    .top-bar { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between; padding-top: env(safe-area-inset-top, 8px); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 15px; letter-spacing: 0.5px; }
    .brand svg { width: 32px; height: 32px; filter: drop-shadow(0 0 10px rgba(255, 252, 0, 0.6)); }
    .badge { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 9999px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #f59e0b; font-size: 11px; font-weight: 700; }
    .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; animation: pulse 1.5s infinite; }
    .center-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; margin: auto 0; }
    .icon-wrapper { position: relative; width: 72px; height: 72px; border-radius: 24px; background: #141418; border: 1px solid rgba(255, 255, 255, 0.12); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6); }
    .icon-ping { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 2px solid rgba(255, 252, 0, 0.25); animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
    p { font-size: 13px; color: rgba(255, 255, 255, 0.6); line-height: 1.5; }
    .retry-btn { width: 100%; max-width: 280px; height: 48px; border-radius: 9999px; background: #FFFC00; color: #000; border: none; font-size: 14px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 20px rgba(255, 252, 0, 0.25); transition: transform 0.1s ease; }
    .retry-btn:active { transform: scale(0.96); }
    .skeleton-preview { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; opacity: 0.5; padding-bottom: env(safe-area-inset-bottom, 8px); }
    .skeleton-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(255, 255, 255, 0.35); text-align: center; }
    .skeleton-box { height: 48px; border-radius: 16px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.05); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes ping { 75%, 100% { transform: scale(1.4); opacity: 0; } }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <svg viewBox="0 0 100 100" fill="#FFFC00">
        <path d="M50 15c-15 0-25 10-25 24 0 7 2 13 6 17-1 3-3 5-6 6-2 1-3 3-2 5 1 2 3 3 5 3 4 0 8-1 11-3 3 2 7 3 11 3s8-1 11-3c3 2 7 3 11 3 2 0 4-1 5-3 1-2 0-4-2-5-3-1-5-3-6-6 4-4 6-10 6-17 0-14-10-24-25-24z"/>
      </svg>
      <span>SNAP APP</span>
    </div>
    <div class="badge">
      <div class="badge-dot"></div>
      <span>Offline Mode</span>
    </div>
  </div>

  <div class="center-card">
    <div class="icon-wrapper">
      <div class="icon-ping"></div>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFC00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>No Internet Connection</h1>
    <p>SNAP APP is in offline mode. Your dashboard and telemetry will resume immediately upon reconnecting.</p>
    <button class="retry-btn" onclick="retryConnection()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Retry Connection
    </button>
  </div>

  <div class="skeleton-preview">
    <div class="skeleton-label">Cached App Shell Ready</div>
    <div class="skeleton-box"></div>
    <div class="skeleton-box" style="height: 38px;"></div>
  </div>

  <script>
    function checkAndRestore() {
      if (navigator.onLine) {
        fetch('/api/companion/version', { method: 'HEAD', cache: 'no-store' })
          .then(function() { window.location.href = '/admin'; })
          .catch(function() {});
      }
    }
    function retryConnection() {
      const btn = document.querySelector('.retry-btn');
      btn.innerHTML = 'Connecting...';
      fetch('/api/companion/version', { method: 'HEAD', cache: 'no-store' })
        .then(function() { window.location.href = '/admin'; })
        .catch(function() {
          setTimeout(function() { btn.innerHTML = 'Retry Connection'; }, 800);
        });
    }
    window.addEventListener('online', checkAndRestore);
    setInterval(checkAndRestore, 1500);
  </script>
</body>
</html>
